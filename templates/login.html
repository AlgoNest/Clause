{% extends "layout.html" %}
{% block title %}Login — Clause AI{% endblock %}
{% block body %}

<div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh; background: #f7f9fc;">
  <div class="card shadow-sm border-0 p-4" style="width: 380px; border-radius: 18px;">
    
    <!-- Heading -->
    <h3 class="text-center mb-1">Welcome Back</h3>
    <p class="text-center text-muted mb-4" style="font-size: 0.9rem;">
      Sign in to your Clause AI account
    </p>

    <form action="/login" method="POST">

      <!-- Email -->
      <div class="form-group mb-3">
        <label class="fw-semibold">Email</label>
        <input type="email" class="form-control py-2" 
               name="email" placeholder="you@example.com" required
               style="border-radius: 10px;">
      </div>

      <!-- Password -->
      <div class="form-group mb-3">
        <label class="fw-semibold">Password</label>
        <input type="password" class="form-control py-2" 
               name="password" placeholder="••••••••" required
               style="border-radius: 10px;">
      </div>

      <!-- Forgot Password -->
      <div class="text-end mb-3">
        <a href="/forgot-password" class="text-decoration-none" style="font-size: 0.9rem;">
          Forgot password?
        </a>
      </div>

      <!-- Submit Button -->
      <button type="submit" 
              class="btn w-100 py-2" 
              style="background: #0056ff; color: white; border-radius: 10px; font-weight: 600;">
        Login
      </button>

      <!-- Signup Link -->
      <p class="text-center mt-4" style="font-size: 0.95rem;">
        Not registered yet?
        <a href="/signup" class="fw-semibold">Create an account</a>
      </p>

    </form>
  </div>
</div>

{% endblock %}
