{% extends "layout.html" %}
{% block title %}Login — Clause AI{% endblock %}
{% block body %}

<style>
  body {
    background: linear-gradient(135deg, #eef2ff, #f8fbff);
    overflow: hidden;
    margin: 0;
    padding: 0;
  }

  /* Perfect center wrapper */
  .full-center {
    position: relative;
    height: 100vh;
    width: 100vw;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Glass card */
  .glass-card {
    backdrop-filter: blur(14px);
    background: rgba(255, 255, 255, 0.75);
    border-radius: 20px;
    padding: 35px;
    width: 380px;
    z-index: 10;
    animation: fadeSlide 0.8s ease-out forwards;
    box-shadow: 0 8px 25px rgba(0,0,0,0.1);
  }

  @keyframes fadeSlide {
    0% { opacity: 0; transform: translateY(25px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  /* Floating shapes animation */
  @keyframes float {
    0%   { transform: translateY(0px); }
    50%  { transform: translateY(-20px); }
    100% { transform: translateY(0px); }
  }

  .shape {
    position: absolute;
    opacity: 0.35;
    animation: float 6s ease-in-out infinite;
  }

  /* Document Shape */
  .doc-shape {
    width: 130px;
    height: 160px;
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 0 20px rgba(0,0,0,0.08);
    top: 10%;
    left: 8%;
    transform: rotate(-12deg);
  }

  /* Pen Shape */
  .pen-shape {
    width: 12px;
    height: 180px;
    background: #0056ff;
    border-radius: 6px;
    top: 40%;
    right: 15%;
    transform: rotate(20deg);
  }

  /* Laptop Shape */
  .laptop-shape {
    width: 200px;
    height: 130px;
    border: 3px solid #333;
    border-radius: 10px;
    bottom: 8%;
    left: 50%;
    transform: translateX(-50%) rotate(2deg);
    background: white;
    animation-delay: 1s;
  }

  /* Inside screen */
  .laptop-shape:before {
    content: "";
    position: absolute;
    top: 10px;
    left: 10px;
    right: 10px;
    bottom: 20px;
    background: #eef2ff;
    border-radius: 6px;
  }

  .glass-card input {
    border-radius: 12px !important;
    padding: 10px 13px !important;
  }

  .btn-cta {
    border-radius: 12px;
    font-weight: 600;
    font-size: 1rem;
    transition: 0.2s;
  }

  .btn-cta:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 15px rgba(0, 86, 255, 0.3);
  }

  .subtle {
    font-size: 0.9rem;
    color: #6c6c6c;
  }
</style>

<div class="full-center">

  <!-- Shapes -->
  <div class="shape doc-shape"></div>
  <div class="shape pen-shape"></div>
  <div class="shape laptop-shape"></div>

  <!-- Login Card -->
  <div class="glass-card">
    <h2 class="text-center mb-1" style="font-weight: 700;">Welcome Back</h2>
    <p class="text-center subtle mb-4">Login to your Clause AI account</p>

    <form action="/login" method="POST">

      <div class="form-group mb-3">
        <label class="fw-semibold">Email</label>
        <input type="email" class="form-control" name="email" required placeholder="you@example.com">
      </div>

      <div class="form-group mb-3">
        <label class="fw-semibold">Password</label>
        <input type="password" class="form-control" name="password" required placeholder="••••••••">
      </div>

      <div class="text-end mb-3">
        <a href="/forgot-password" class="subtle text-decoration-none">Forgot password?</a>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2 btn-cta" style="background: #0056ff;">
        Login
      </button>

      <p class="text-center mt-3 subtle">
        New to Clause AI?  
        <a href="/signup" class="fw-semibold">Create an account</a>
      </p>

    </form>
  </div>
</div>

{% endblock %}
