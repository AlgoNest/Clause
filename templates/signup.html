<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signup</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #eef1ff, #ffffff);
      overflow: hidden;
    }

    /* Floating decorative shapes */
    .shape {
      position: absolute;
      opacity: 0.1;
      animation: float 6s ease-in-out infinite;
      filter: drop-shadow(0 5px 8px rgba(0, 0, 0, 0.1));
    }

    .shape.one {
      top: 10%;
      left: 8%;
      width: 110px;
      animation-duration: 7s;
    }

    .shape.two {
      bottom: 12%;
      right: 10%;
      width: 100px;
      animation-duration: 9s;
    }

    .shape.three {
      top: 18%;
      right: 25%;
      width: 120px;
      animation-duration: 8s;
    }

    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-25px); }
      100% { transform: translateY(0); }
    }

    /* Wrapper */
    .wrapper {
      text-align: center;
      animation: fadeIn 0.7s ease-out forwards;
    }

    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(40px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* Big heading */
    .main-heading {
      font-size: 38px;
      font-weight: 700;
      color: #252525;
      margin-bottom: 20px;
      letter-spacing: -0.5px;
    }

    .subtext {
      font-size: 15px;
      color: #555;
      margin-bottom: 40px;
    }

    /* Card form */
    .form-card {
      width: 380px;
      padding: 35px;
      background: #ffffff;
      border-radius: 18px;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.07);
      text-align: left;
    }

    label {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
      display: block;
      color: #333;
    }

    input {
      width: 100%;
      padding: 12px 15px;
      margin-bottom: 20px;
      border: 1px solid #dcdcdc;
      border-radius: 10px;
      font-size: 15px;
      transition: 0.2s ease;
    }

    input:focus {
      border-color: #6c63ff;
      outline: none;
      box-shadow: 0 0 10px rgba(108, 99, 255, 0.25);
    }

    button {
      width: 100%;
      padding: 12px;
      background: #6c63ff;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      cursor: pointer;
      transition: 0.2s ease;
      font-weight: 600;
    }

    button:hover {
      background: #5a54db;
    }

    .footer-text {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
    }

    a {
      color: #6c63ff;
      text-decoration: none;
      font-weight: 500;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <!-- Shapes -->
  <img src="https://cdn-icons-png.flaticon.com/512/2991/2991108.png" class="shape one">
  <img src="https://cdn-icons-png.flaticon.com/512/906/906334.png" class="shape two">
  <img src="https://cdn-icons-png.flaticon.com/512/681/681392.png" class="shape three">

  <div class="wrapper">
    <h1 class="main-heading">Create Your Account</h1>
    <p class="subtext">Join us and start using Clause AI with ease.</p>

    <div class="form-card">
      <form method="POST" action="/signup">

        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>

        <button type="submit">Sign Up</button>

        <p class="footer-text">
          Already have an account? <a href="/login">Login</a>
        </p>
      </form>
    </div>
  </div>

</body>
</html>
