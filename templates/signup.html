{% extends "layout.html" %}
{% block title %}Login — Clause AI{% endblock %}
{% block body %}

<div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh; background: #f5f7fb;">
  <div class="card shadow-lg border-0 p-4" style="width: 420px; border-radius: 22px;">
    
    

    <form action="/login" method="POST">

      <!-- Email -->
      <div class="form-group mb-3">
        <label class="fw-bold">Email</label>
        <input type="email" class="form-control py-2" name="email" placeholder="you@example.com" required style="border-radius: 12px;">
      </div>

      <!-- Password -->
      <div class="form-group mb-3">
        <label class="fw-bold">Password</label>
        <input type="password" class="form-control py-2" name="password" placeholder="••••••••" required style="border-radius: 12px;">
      </div>

      <!-- Forgot Password -->
      <div class="text-end mb-3">
        <a href="/forgot-password" class="text-decoration-none" style="font-size: 0.9rem;">Forgot password?</a>
      </div>

      <!-- Login Button -->
      <button type="submit" class="btn w-100 py-2" style="background: #0066ff; border-radius: 12px; color: white; font-weight: 600;">
        Login
      </button>

      <!-- Divider -->
      <div class="text-center my-3">
        <span class="text-muted" style="font-size: 0.85rem;">or</span>
      </div>


      <!-- Signup Link -->
      <p class="text-center mt-4" style="font-size: 0.95rem;">
        New to Clause AI?
        <a href="/signup" class="fw-semibold">Create an account</a>
      </p>

    </form>
  </div>
</div>

{% endblock %}
