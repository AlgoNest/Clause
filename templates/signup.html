<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signup — Clause AI</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #eef1ff, #ffffff);
      overflow: hidden;
    }

    /* Floating shapes */
    .shape {
      position: absolute;
      opacity: 0.12;
      animation-iteration-count: infinite;
    }

    .doc { top: 8%; left: 10%; width: 100px; animation: floatLeft 8s ease-in-out infinite; }
    .pen { bottom: 12%; right: 10%; width: 90px; animation: floatRight 7s ease-in-out infinite; }
    .check { top: 20%; right: 25%; width: 70px; animation: floatUp 6s ease-in-out infinite; }

    @keyframes floatLeft {
      0%, 100% { transform: translateX(0) translateY(0); }
      50% { transform: translateX(-15px) translateY(-10px); }
    }
    @keyframes floatRight {
      0%, 100% { transform: translateX(0) translateY(0); }
      50% { transform: translateX(15px) translateY(-10px); }
    }
    @keyframes floatUp {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }

    /* Wrapper */
    .wrapper {
      text-align: center;
      animation: fadeIn 0.7s ease-out forwards;
    }

    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(40px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* Big heading */
    .main-heading {
      font-size: 38px;
      font-weight: 700;
      color: #252525;
      margin-bottom: 15px;
    }

    .subtext {
      font-size: 16px;
      color: #555;
      margin-bottom: 40px;
    }

    /* Form card */
    .form-card {
      width: 380px;
      padding: 35px;
      background: #ffffff;
      border-radius: 18px;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.07);
      text-align: left;
      position: relative;
      z-index: 10;
    }

    label {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
      display: block;
      color: #333;
    }

    input {
      width: 100%;
      padding: 12px 15px;
      margin-bottom: 20px;
      border: 1px solid #dcdcdc;
      border-radius: 10px;
      font-size: 15px;
      transition: 0.2s ease;
    }

    input:focus {
      border-color: #0056ff;
      outline: none;
      box-shadow: 0 0 10px rgba(0, 86, 255, 0.25);
    }

    button {
      width: 100%;
      padding: 12px;
      background: #0056ff;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      cursor: pointer;
      transition: 0.2s ease;
      font-weight: 600;
    }

    button:hover {
      background: #0041cc;
    }

    .footer-text {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
    }

    a {
      color: #0056ff;
      text-decoration: none;
      font-weight: 500;
    }

    a:hover {
      text-decoration: underline;
    }

  </style>
</head>

<body>

  <!-- Floating icons representing contracts/AI -->
  <img src="https://cdn-icons-png.flaticon.com/512/2991/2991108.png" class="shape doc" alt="Document">
  <img src="https://cdn-icons-png.flaticon.com/512/906/906334.png" class="shape pen" alt="Pen">
  <img src="https://cdn-icons-png.flaticon.com/512/190/190411.png" class="shape check" alt="Checkmark">

  <div class="wrapper">
    <h1 class="main-heading">Review Your Rental Contracts Smarter</h1>
    <p class="subtext">Join Clause AI and manage your contracts with confidence.</p>

    <div class="form-card">
      <form method="POST" action="/signup">

        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>

        <button type="submit">Sign Up</button>

        <p class="footer-text">
          Already have an account? <a href="/login">Login</a>
        </p>
      </form>
    </div>
  </div>

</body>
</html>
